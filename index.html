<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#2f9e41">
  <meta name="color-scheme" content="only light">
  <meta name="description" content="Além do Vibecoding: uma oficina sobre decisões, engenharia de software e desenvolvimento com IA. IFRS Campus Osório.">
  <title>Além do Vibecoding · João Lucas</title>
  <link rel="stylesheet" href="styles.css">
  <script src="slides.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#slide">Ir para o slide</a>
  <header class="masthead">
    <span>IFRS <span class="campus">Campus Osório</span></span>
    <span id="chapter">Oficina de IA aplicada</span>
  </header>
  <main id="slide" class="slide" tabindex="-1" aria-label="Apresentação"></main>
  <footer class="controls">
    <div class="tools">
      <button id="fullscreen" class="quiet" title="Tela cheia (F)" aria-label="Entrar em tela cheia">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M8 3H3v5M16 3h5v5M3 16v5h5M21 16v5h-5"/></svg>
      </button>
      <button id="autoplay" class="quiet" hidden aria-label="Pausar demonstração" aria-pressed="false" title="Pausar demonstração (P)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path id="autoplay-icon" d="M9 5v14M15 5v14"/></svg>
      </button>
    </div>
    <nav aria-label="Navegação dos slides">
      <button id="previous" aria-label="Voltar" title="Voltar (←)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="m14 6-6 6 6 6"/></svg></button>
      <span id="counter" aria-label="Slide atual"></span>
      <button id="next" aria-label="Avançar" title="Avançar (→ ou Espaço)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="m10 6 6 6-6 6"/></svg></button>
    </nav>
  </footer>
  <div class="progress" role="progressbar" aria-label="Progresso da apresentação" aria-valuemin="1"><span></span></div>
  <p id="announcement" class="sr-only" role="status" aria-live="polite"></p>
  <noscript>Ative o JavaScript para navegar na apresentação.</noscript>
</body>
</html>
