:root{
  color-scheme:only light;--green-stage:#237a32;--ease-out:cubic-bezier(0.23,1,0.32,1);--feedback-duration:180ms;
  --if-green:#2f9e41;--if-red:#cd191e;--paper:#fff;--ink:#151915;
  --green-ink:#216f2e;--muted:#566056;--line:#d6ded6;--wash:#f0f6f0;
  --gutter:clamp(24px,6vw,104px);--header:82px;--footer:88px;
  font-family:"Open Sans",Arial,sans-serif;color:var(--ink);background:var(--paper);
  font-synthesis:none;
}
*{box-sizing:border-box}
body{margin:0;min-height:100svh}
button,a{-webkit-tap-highlight-color:transparent}
button{font:inherit;cursor:pointer;color:inherit}
a{color:var(--green-ink);text-underline-offset:5px}
button:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid var(--if-red);outline-offset:5px}
button:disabled{cursor:default;opacity:.3}
button svg{width:22px;height:22px;display:block}
.masthead{height:var(--header);padding:0 var(--gutter);display:flex;align-items:center;justify-content:space-between;font-size:14px;font-weight:700;gap:20px}
.masthead>span:first-child{display:flex;gap:16px;align-items:center}
.campus{font-weight:400;border-left:1px solid var(--line);padding-left:16px}
#chapter{color:var(--muted);font-weight:400;text-align:right}
.slide{min-height:calc(100svh - var(--header) - var(--footer));padding:clamp(22px,4vh,56px) var(--gutter) 40px;display:flex;flex-direction:column;justify-content:center;position:relative;isolation:isolate;outline:none}
h1,h2,h3,p,blockquote,pre{margin:0}
h1,h2,h3{font-weight:700;letter-spacing:-.04em;text-wrap:balance;line-height:1.08}
h1{font-size:clamp(62px,9.8vw,158px);max-width:11ch}
h2{font-size:clamp(42px,5.2vw,82px);max-width:20ch;margin-bottom:40px}
h3{font-size:clamp(24px,2.5vw,38px);letter-spacing:-.035em}
p,li{font-size:clamp(20px,2.05vw,32px);line-height:1.5;max-width:60ch}
.lead{font-size:clamp(24px,2.7vw,42px);line-height:1.4;max-width:40ch;letter-spacing:-.025em}
.small{font-size:clamp(15px,1.15vw,18px);line-height:1.6;color:var(--muted)}
.caption{font-size:clamp(17px,1.45vw,23px);line-height:1.5;color:var(--muted);margin-top:28px;max-width:60ch}
.cover{justify-content:space-between;padding-top:5vh;gap:40px}
.cover h1{color:var(--if-green)}
.cover h1::after{content:".";color:var(--if-red)}
.cover-bottom{display:flex;justify-content:space-between;align-items:flex-end;gap:40px}
.cover-bottom .lead{max-width:24ch;font-size:clamp(22px,2.1vw,34px)}
.byline{text-align:right;min-width:220px}
.byline strong{font-size:20px;display:block;margin-bottom:5px}
.cover-index{position:absolute;top:7vh;right:var(--gutter);color:var(--if-green);font-size:clamp(90px,14vw,210px);font-weight:700;line-height:1;letter-spacing:-.04em;writing-mode:vertical-rl;opacity:.15;z-index:-1}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(30px,5vw,88px);align-items:start}
.split>div,.split>section{min-width:0}
.split h3{margin-bottom:20px}
.split p+p{margin-top:20px}
.split .lead{font-size:clamp(23px,2.6vw,40px)}
.person h2{font-size:clamp(54px,7vw,112px);max-width:10ch}
.person .bio{padding-top:20px}
.links{display:flex;flex-wrap:wrap;gap:20px;margin-top:35px;font-size:20px}
.question h2{font-size:clamp(48px,6.8vw,108px);max-width:18ch}
.question .caption{max-width:48ch}
.tool-names{display:flex;gap:28px;flex-wrap:wrap;margin-top:45px;font-size:clamp(20px,2vw,30px);color:var(--green-ink)}
.statement{background:var(--green-stage);color:var(--paper)}
.statement h2{font-size:clamp(62px,9vw,145px);max-width:15ch;margin-bottom:35px}
.statement .lead{font-size:clamp(23px,2.5vw,38px)}
.statement .caption{color:var(--paper)}
.red-word{color:var(--if-red)}
.definition{border-left:1px solid var(--if-green);padding-left:32px;max-width:48ch}
.contrast{border-top:2px solid var(--line);padding-top:25px}
.contrast.positive{border-top-color:var(--if-green)}
.contrast.negative{border-top-color:var(--if-red)}
.contrast h3{font-size:22px;letter-spacing:0;margin-bottom:24px}
.contrast p{font-size:clamp(23px,2.8vw,42px);letter-spacing:-.035em;line-height:1.35}
.reveal{visibility:hidden}
.reveal.shown{visibility:visible}
.reveal.shown .focus-code{background:var(--wash)}
.rows{display:flex;flex-direction:column;gap:0}
.row{display:grid;grid-template-columns:180px 1fr;gap:30px;padding:19px 0;border-top:1px solid var(--line);align-items:baseline}
.row dt{font-size:20px;font-weight:700;color:var(--green-ink)}
.row dd{margin:0;font-size:clamp(20px,2vw,29px);line-height:1.45}
.flow{display:flex;align-items:stretch;gap:0;margin:20px 0 30px;padding:0;list-style:none}
.flow li{flex:1;min-width:0;position:relative;padding:22px 25px 20px 0;font-size:clamp(20px,2vw,31px);font-weight:700;border-top:4px solid var(--if-green)}
.flow li+li{padding-left:25px}
.flow li+li::before{content:"›";position:absolute;left:-6px;top:21px;color:var(--green-ink);font-weight:400}
.flow small{display:block;font-size:clamp(15px,1.4vw,22px);font-weight:400;margin-top:12px;color:var(--muted);line-height:1.5}
.code{font-family:"DejaVu Sans Mono",Consolas,monospace;background:var(--wash);border-left:1px solid var(--if-green);padding:28px 32px;font-size:clamp(17px,1.6vw,25px);line-height:1.65;tab-size:4;max-width:100%;white-space:pre-wrap;overflow-wrap:anywhere}
.code .kw{color:var(--green-ink);font-weight:700}
.code .comment{color:var(--muted)}
.code .focus-code{background:#d5e9d7;display:inline-block;width:100%}
.code-title{font-size:17px;color:var(--muted);margin-bottom:12px}
.exercise{grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);align-items:center}
.exercise .lead{font-size:clamp(26px,3vw,46px)}
.exercise .caption{font-size:clamp(17px,1.5vw,23px)}
.action{background:var(--green-ink);color:white;border:0;border-radius:4px;padding:13px 22px;min-height:48px;font-size:18px;transition:background-color var(--feedback-duration) ease,border-color var(--feedback-duration) ease}
.action:hover{background:#174f20}
.action.secondary{color:var(--ink);background:var(--wash);border:1px solid var(--line)}
.action.secondary:hover{background:#dcebdc}
.demo-actions{display:flex;gap:14px;flex-wrap:wrap;margin-top:26px}
.memory{margin-top:25px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px}
.memory>div{border-left:1px solid var(--if-green);padding:10px 0 10px 20px}
.memory span{display:block;font-size:16px;color:var(--muted)}
.memory output{font-size:clamp(20px,2.2vw,34px);font-weight:700}
.memory [data-changed="true"]{border-color:var(--if-red)}
.memory [data-changed="true"] output{color:var(--if-red)}
.demo-result{min-height:4.5em;margin-top:18px;font-size:19px;max-width:60ch;color:var(--green-ink)}
.file-label{font-size:clamp(25px,3vw,45px);font-weight:700;letter-spacing:-.04em;margin-bottom:20px}
.scope-table{width:100%;border-collapse:collapse;margin-top:12px;text-align:left}

.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.skip-link{position:fixed;top:10px;left:10px;z-index:10;transform:translateY(-150%);background:white;padding:15px}
.skip-link:focus{transform:translateY(0)}

px}.definition{padding-left:20px}.list li{font-size:21px}}

/* Enquadramento da apresentação: todos os estados cabem na área medida. */
html{width:100%;height:100%;overflow:clip;background:var(--paper)}
:root{--header:clamp(44px,8dvh,78px);--footer:clamp(56px,10dvh,84px)}
body{width:100%;height:100vh;height:100dvh;min-height:0;display:grid;grid-template-rows:var(--header) minmax(0,1fr) var(--footer);overflow:hidden;background:var(--paper);color:var(--ink)}
[hidden]{display:none!important}
::selection{background:var(--green-ink);color:var(--paper)}
.masthead{min-width:0;height:100%}
.slide,.cover{min-width:0;min-height:0;width:100%;height:100%;padding:clamp(12px,3dvh,36px) var(--gutter);display:flex;justify-content:center;align-items:center;overflow:hidden;margin:0;max-width:none}
.slide-content{width:100%;max-width:1560px;min-width:0;flex:0 0 auto;display:flex;flex-direction:column;position:relative;transform-origin:center}
.cover .slide-content{gap:clamp(36px,8dvh,90px)}
.cover-index{top:0;right:0;letter-spacing:-.04em}
body[data-tone="green"]{background:var(--green-stage);color:var(--paper)}
body[data-tone="green"] #chapter,body[data-tone="green"] .caption,body[data-tone="green"] .small{color:var(--paper)}
body[data-tone="green"] .campus{border-color:rgb(255 255 255 / .45)}
body[data-tone="green"] .controls button{border-color:rgb(255 255 255 / .55)}
body[data-tone="green"] .controls button:hover:not(:disabled){background:rgb(255 255 255 / .12);color:var(--paper)}
body[data-tone="green"] :focus-visible{outline-color:var(--paper)}
body[data-tone="green"] .progress{background:rgb(255 255 255 / .16)}
.keyword{color:var(--if-red);font-weight:700}
.controls{min-height:0;height:100%;padding-top:0;padding-bottom:6px}
.controls button:active:not(:disabled){opacity:.65}
.action,.action.secondary{background:var(--wash);color:var(--ink);border:1px solid var(--line);font-weight:700}
.action[aria-pressed="true"]{color:var(--if-red);border-color:var(--if-red);font-weight:700}
.action:hover,.action.secondary:hover{background:var(--wash)}
.action:active,.choice:active{opacity:.75}
.memory>div{border-left:0;border-top:2px solid var(--if-green);padding:18px 0}
.scope-table{table-layout:fixed}
.scope-table th,.scope-table td{overflow-wrap:anywhere}
#requirement-acceptance{min-height:3em}
@media(max-width:650px){
  :root{--gutter:22px;--header:54px;--footer:62px}
  h1{font-size:clamp(50px,13vw,82px)}h2{font-size:35px;margin-bottom:24px}
  .cover .slide-content{gap:36px}.cover-bottom .lead{font-size:22px}.byline{margin-top:24px}
  .split,.exercise,.translation{grid-template-columns:minmax(0,1fr);gap:24px}
  .row{grid-template-columns:minmax(0,1fr);padding:12px 0}.row dt{font-size:16px}.row dd{font-size:19px}
  .stack{grid-template-columns:minmax(0,1fr);gap:20px}
  .decision-prompts{grid-template-columns:minmax(0,1fr);gap:18px}
  .decision-prompts p{font-size:23px;padding-top:12px}.decision-prompts small{font-size:16px}
  .caption{font-size:16px}.code{line-height:1.6}.lead{font-size:23px}
  .scope-table th,.scope-table td{font-size:14px;padding:14px 8px 14px 0}
  .translation-output{min-height:190px}.translation-output p{font-size:26px}
  .translation-output h3{font-size:18px;margin-bottom:14px}
  .choice{min-height:48px;padding:12px 16px;font-size:19px}
  .memory{margin-top:0}.memory>div{padding:12px 0}.demo-result{min-height:4.5em;font-size:17px}
  .action{padding:12px;font-size:16px}.controls button{width:44px;height:44px}
}

/* Movimento: as entradas ficam em app.js (WAAPI); aqui, só mudanças de estado. */
body,.slide{transition:background-color 360ms ease,color 360ms ease}
#chapter,.caption,.small{transition:color 360ms ease}
.progress span{transition:transform 480ms var(--ease-out)}
.controls button{transition:background-color var(--feedback-duration) ease,border-color var(--feedback-duration) ease,transform 140ms var(--ease-out)}
.action,.choice{transition:background-color var(--feedback-duration) ease,border-color var(--feedback-duration) ease,color var(--feedback-duration) ease,transform 140ms var(--ease-out)}
.controls button:active:not(:disabled){transform:scale(.94)}
.action:active,.choice:active{transform:scale(.98)}
.memory>div{transition:border-color 260ms ease}
.memory output{transition:color 260ms ease}
@media(prefers-reduced-motion:reduce){
  .progress span{transition:none}
  .controls button:active:not(:disabled),.action:active,.choice:active{transform:none}
}

/* Verde no texto: títulos no verde oficial (corpo grande), rótulos no verde escuro. */
h2{color:var(--if-green)}
h3,.flow li,.file-label,.byline strong,.memory output,.masthead>span:first-child{color:var(--green-ink)}
.masthead>span:first-child{transition:color 360ms ease}
.campus{color:var(--ink)}
.statement h2,body[data-tone="green"] .masthead>span:first-child,body[data-tone="green"] .campus{color:inherit}
.contrast.negative h3:not(.keyword){color:var(--ink)}

/* Escada de abstração */
.stairs{list-style:none;margin:8px 0 0;padding:0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));align-items:end;gap:clamp(8px,1vw,16px);--step:clamp(40px,7dvh,78px)}
.stairs li{display:flex;flex-direction:column;gap:6px;padding:16px 16px 0;border-top:4px solid var(--if-green);background:var(--wash);font-size:clamp(17px,1.6vw,26px);line-height:1.25;max-width:none}
.stairs li:nth-child(1){min-height:calc(var(--step)*1.5)}
.stairs li:nth-child(2){min-height:calc(var(--step)*2.3)}
.stairs li:nth-child(3){min-height:calc(var(--step)*3.1)}
.stairs li:nth-child(4){min-height:calc(var(--step)*3.9)}
.stairs li:nth-child(5){min-height:calc(var(--step)*4.7)}
.stairs strong{color:var(--green-ink)}
.stairs small{font-size:clamp(13px,1.1vw,17px);color:var(--muted)}
.stairs .stairs-top{border-top-color:var(--if-red)}
.stairs .stairs-top strong{color:var(--if-red)}

/* Requisitos, skills, formulário e fatos do campus */
.tag-id{display:block;font-family:"DejaVu Sans Mono",Consolas,monospace;font-size:14px;font-weight:400;color:var(--muted);margin-bottom:2px}
.skill-list li{display:flex;flex-direction:column;gap:6px;font-size:clamp(18px,1.6vw,24px);line-height:1.45}
.skill-list code{font-family:"DejaVu Sans Mono",Consolas,monospace;font-weight:700;color:var(--green-ink)}
.tags{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:10px}
.tags li{font-size:clamp(16px,1.45vw,22px);line-height:1.3;padding:8px 14px;border:1px solid var(--line);border-radius:999px;background:var(--wash);max-width:none}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(24px,4vw,64px);margin:clamp(28px,5dvh,56px) 0 0}
.facts div{border-top:2px solid rgb(255 255 255 / .5);padding-top:16px}
.facts dt{font-size:clamp(40px,5vw,76px);font-weight:700;letter-spacing:-.04em;line-height:1}
.facts dd{margin:10px 0 0;font-size:clamp(17px,1.6vw,24px);line-height:1.4}

/* Cenas ilustradas: casa, prédio e condomínio */
.build{display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.15fr);gap:clamp(30px,5vw,80px);align-items:center}
.build-steps{list-style:none;margin:0;padding:0}
.build-steps li{display:grid;grid-template-columns:minmax(0,10ch) minmax(0,1fr);gap:20px;padding:12px 0;border-top:1px solid var(--line);font-size:clamp(19px,1.8vw,28px);line-height:1.3;align-items:baseline;max-width:none}
.build-steps span{color:var(--green-ink);font-weight:700}
.towns h3{margin-bottom:10px}
/* Palco 3D: perspectiva no palco, mundo com câmera em --rx/--ry e escala --k (app.js). */
.stage3d{position:relative;width:100%;perspective:1400px;perspective-origin:50% 35%;--rx:-22deg;--ry:-34deg;--k:1}
.stage3d.house{max-height:58dvh}
.stage3d.house[data-stage=""],.stage3d.house[data-stage="planta"]{--rx:-62deg;--ry:-14deg}
.stage3d.house[data-stage="chaves"]{--ry:-46deg}
.towns .stage3d{margin-bottom:18px}
.stage3d .world{position:absolute;left:50%;top:68%;width:0;height:0;transform-style:preserve-3d;transform:scale(var(--k)) rotateX(var(--rx)) rotateY(var(--ry));transition:transform 1.2s cubic-bezier(0.77,0,0.175,1)}
.stage3d.tower3 .world{top:82%}
.stage3d.condo3 .world{top:66%}
.stage3d .at,.stage3d .anim{position:absolute;left:0;top:0;transform-style:preserve-3d}
.stage3d .at{transform:translate3d(var(--x),var(--y),var(--z))}
.stage3d .anim{transform-origin:0 0}
.stage3d [data-part]{visibility:hidden}
.stage3d [data-part].shown{visibility:visible}
.stage3d .box{position:absolute;left:calc(var(--w) / -2);top:calc(var(--h) * -1);width:var(--w);height:var(--h);transform-style:preserve-3d}
.stage3d .face{position:absolute;left:0;top:0;width:var(--w);height:var(--h);background:var(--fc);--fc:var(--cf)}
.stage3d .face.f{transform:translateZ(calc(var(--d) / 2))}
.stage3d .face.k{transform:rotateY(180deg) translateZ(calc(var(--d) / 2));--fc:var(--cs)}
.stage3d .face.l,.stage3d .face.r{width:var(--d);left:calc((var(--w) - var(--d)) / 2);--fc:var(--cs)}
.stage3d .face.l{transform:rotateY(-90deg) translateZ(calc(var(--w) / 2))}
.stage3d .face.r{transform:rotateY(90deg) translateZ(calc(var(--w) / 2))}
.stage3d .face.t{height:var(--d);top:calc((var(--h) - var(--d)) / 2);transform:rotateX(90deg) translateZ(calc(var(--h) / 2));--fc:var(--ct)}
.stage3d .plane{position:absolute;left:0;top:0;display:block;font-style:normal}
.stage3d .ground3{position:absolute;left:0;top:0;transform:rotateX(90deg);background:radial-gradient(closest-side,#e2ebe2,rgb(226 235 226 / 0))}
.stage3d .plan{position:absolute;left:-150px;top:-110px;width:300px;height:250px;overflow:visible;transform-origin:150px 110px;transform:rotateX(90deg)}
.stage3d .plan path{fill:none;stroke:var(--if-green);stroke-width:2.5;stroke-linecap:round}
.stage3d .plan text{fill:var(--green-ink);font:700 13px "Open Sans",Arial,sans-serif;text-anchor:middle}
.stage3d .plan .dim{font-weight:400}
.stage3d .road3 path{stroke:#b9cbb9;stroke-width:10}
.stage3d [data-anim="draw"]{stroke-dasharray:1;stroke-dashoffset:0}
.stage3d .slab3{--cf:#5f685f;--cs:#4b544c;--ct:#778077}
.stage3d .course{--cf:#e9f1e9;--cs:#c9d8c9;--ct:#f5f9f5}
.stage3d .course.alt{--cf:#dfeadf;--cs:#bfcfbf}
.stage3d .floor{--cf:#e9f1e9;--cs:#c9d8c9;--ct:#f5f9f5}
.stage3d .floor .face.f,.stage3d .floor .face.r{background-image:linear-gradient(var(--fc) 0 12px,transparent 12px 32px,var(--fc) 32px),repeating-linear-gradient(90deg,var(--fc) 0 10px,#fff 10px 28px,var(--fc) 28px 37.5px)}
.stage3d .floor.ground-floor .face.f{background-image:none}
.stage3d .roofslab{--cf:#b0161a;--cs:#951216;--ct:var(--if-red)}
.stage3d .pole3{--cf:var(--ink);--cs:var(--ink);--ct:var(--ink)}
.stage3d .roofplane{background:repeating-linear-gradient(#cd191e 0 13px,#b8161b 13px 14px)}
.stage3d .roofplane.green{background:repeating-linear-gradient(#216f2e 0 9px,#1b5c26 9px 10px)}
.stage3d .roofplane.gray{background:repeating-linear-gradient(#5f685f 0 9px,#4f574f 9px 10px)}
.stage3d .roofplane.back{filter:brightness(.8)}
.stage3d .gable{background:#c9d8c9}
.stage3d .win{position:relative;overflow:hidden;background:var(--paper);border:3px solid var(--green-ink);box-sizing:border-box}
.stage3d .win .bars{position:absolute;inset:0;background:linear-gradient(var(--green-ink),var(--green-ink)) center/3px 100% no-repeat,linear-gradient(var(--green-ink),var(--green-ink)) center/100% 3px no-repeat}
.stage3d .light{position:absolute;inset:0;background:#ffd665}
.stage3d .door3{position:relative;overflow:hidden;background:var(--green-ink)}
.stage3d .door3 .leaf{position:absolute;left:0;top:0;bottom:0;width:24%;background:#174f20}
.stage3d .badge{position:absolute;left:-15px;top:-15px;width:30px;height:30px;border-radius:50%;background:var(--if-green);display:grid;place-items:center;transform:rotateY(calc(var(--ry) * -1)) rotateX(calc(var(--rx) * -1));transition:transform 1.2s cubic-bezier(0.77,0,0.175,1)}
.stage3d .badge svg{width:22px;height:22px}
.stage3d .badge path{fill:none;stroke:var(--paper);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.stage3d .pennant{position:absolute;left:0;top:-13px;width:74px;height:26px;padding-left:9px;box-sizing:border-box;background:var(--if-green);color:var(--paper);font:700 13px/26px "Open Sans",Arial,sans-serif;font-style:normal;clip-path:polygon(0 0,100% 0,86% 50%,100% 100%,0 100%)}
@media(prefers-reduced-motion:reduce){.stage3d .world,.stage3d .badge{transition:none}}

@media(max-width:650px){
  .stairs{grid-template-columns:minmax(0,1fr);gap:6px}
  .stairs li{min-height:0!important;padding:10px 14px;border-top:0;border-left:4px solid var(--if-green)}
  .stairs .stairs-top{border-left-color:var(--if-red)}
  .facts{grid-template-columns:minmax(0,1fr);gap:14px;margin-top:24px}.facts dt{font-size:38px}
  .build{grid-template-columns:minmax(0,1fr);gap:16px}
  .build-steps li{padding:8px 0;font-size:18px}
}

/* Janela do apresentador (?presenter): não é projetada. */
.presenter-view body{display:grid;grid-template-rows:auto minmax(0,1fr);height:100dvh;overflow:hidden;background:var(--paper)}
.pv-head{display:flex;align-items:center;gap:24px;padding:14px 32px;border-bottom:1px solid var(--line);font-size:16px}
#pv-counter{font-weight:700;font-variant-numeric:tabular-nums}
#pv-chapter{color:var(--muted);flex:1}
.pv-timer{font-size:28px;font-weight:700;font-variant-numeric:tabular-nums;background:none;border:1px solid var(--line);border-radius:4px;padding:8px 14px;min-height:48px}
.pv-main{display:grid;grid-template-columns:minmax(0,1fr) minmax(260px,340px);min-height:0}
.pv-notes{padding:28px 40px;overflow:auto}
.pv-notes h1{font-size:clamp(28px,3vw,44px);color:var(--if-green);max-width:none;margin-bottom:12px}
.pv-step{font-size:16px;color:var(--muted);margin:0 0 16px}
.pv-speech{font-size:clamp(20px,1.9vw,28px);line-height:1.55;max-width:62ch}
.pv-cue{font-style:normal;font-weight:700;color:var(--if-red)}
.pv-cue::before{content:"["}.pv-cue::after{content:"]"}
.pv-check{margin-top:28px;padding-top:16px;border-top:1px solid var(--line);font-size:16px;line-height:1.55;color:var(--muted);max-width:70ch}
.pv-side{border-left:1px solid var(--line);padding:28px;display:flex;flex-direction:column;gap:14px;background:var(--wash);min-height:0;overflow:auto}
.pv-label{font-size:14px;font-weight:700;color:var(--green-ink);text-transform:uppercase;letter-spacing:.06em}
.pv-next{font-size:20px;line-height:1.45;margin:0}
.pv-status{font-size:15px;line-height:1.5;color:var(--if-red);margin:0}
.pv-nav{display:flex;gap:10px;margin-top:auto}
.pv-nav button{flex:1;min-height:56px;border:1px solid var(--line);background:var(--paper);border-radius:4px;font-size:18px;font-weight:700}
.pv-nav button:hover:not(:disabled){border-color:var(--green-ink)}
@media(max-width:760px){.pv-main{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto}.pv-side{border-left:0;border-top:1px solid var(--line)}.pv-notes{padding:20px}}
.build-steps li{grid-template-columns:minmax(0,11ch) minmax(0,1fr)}
.row:has(.tag-id){align-items:center}
@media(min-width:651px){.stack:has(> :nth-child(4)){grid-template-columns:repeat(4,minmax(0,1fr));gap:32px}}

/* QR codes: slide do dicionário, canto de cada slide e perfis */
.qr{display:inline-block;background:#fff;padding:8px;line-height:0;border-radius:6px;box-sizing:border-box}
.qr svg{display:block;width:100%;height:auto}
.qr path{fill:#151915}
.slide-qr{display:flex;align-items:center;gap:10px;color:var(--muted);text-decoration:none;font-size:12px;line-height:1.3;min-height:44px}
.slide-qr .qr{width:calc(var(--footer) - 18px);height:calc(var(--footer) - 18px);min-width:44px;min-height:44px;padding:4px;border:1px solid var(--line)}
body[data-tone="green"] .slide-qr{color:var(--paper)}
body[data-tone="green"] .slide-qr .qr{border-color:transparent}
.qr-slide{align-items:center}
.qr-big{display:flex;flex-direction:column;align-items:center;gap:16px}
.qr-large{width:min(46dvh,440px);padding:16px;border:1px solid var(--line)}
.qr-url{font-size:clamp(15px,1.3vw,20px);color:var(--muted);text-align:center;overflow-wrap:anywhere;max-width:none}
.person-grid{align-items:center}
.avatar{display:block;width:clamp(88px,9vw,136px);height:auto;aspect-ratio:1;border-radius:50%;object-fit:cover;margin-bottom:22px;border:3px solid var(--if-green)}
.profiles{display:flex;flex-direction:column;gap:20px}
.profile{display:flex;align-items:center;gap:24px;padding:16px;border:1px solid var(--line);border-radius:8px;color:var(--ink);text-decoration:none;transition:border-color var(--feedback-duration) ease}
.profile:hover{border-color:var(--green-ink)}
.profile .qr{flex:0 0 auto;width:clamp(110px,11vw,168px);padding:6px}
.profile-text{display:flex;flex-direction:column;align-items:flex-start;gap:6px;min-width:0}
.profile-logo{width:34px;height:34px}
.profile strong{font-size:clamp(22px,2vw,32px);letter-spacing:-.02em}
.profile-text span{font-size:clamp(14px,1.25vw,19px);color:var(--muted);overflow-wrap:anywhere}
@media(max-width:650px){.slide-qr-label{display:none}.profile{gap:16px;padding:12px}.profile .qr{width:96px}}

    var PAD1 = 0x11;

    var _modules = null;

      setupPositionProbePattern(_moduleCount - 7, 0);

        setupTypeNumber(test);
      }

      if (_dataCache == null) {

      }

      mapData(_dataCache, maskPattern);
    };

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          } else {
            _modules[row + r][col + c] = false;

      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }

      return pattern;

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

            for (var c = -2; c <= 2; c += 1) {

              } else {
                _modules[row + r][col + c] = false;

          }
        }
      }

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {

        } else {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

      var row = _moduleCount - 1;

            index += 1;
          }

        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );

      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;

        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);

          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);

            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );

          for (var i = 0; i < rsBlocks.length; i++) {

  {
    id: "pensamento-critico", chapter: "Uso crítico de IA",
    title: "O que estamos delegando?", terms: ["Pensamento crítico","Automação"],
    html: `<h2>O que estamos delegando?</h2><div class="split"><div class="contrast positive"><h3>Esforço de implementação</h3><p>Escrever, organizar,<br>repetir, automatizar.</p></div><div class="contrast negative reveal"><h3 class="keyword">Julgamento</h3><p>Escolher, justificar<br>e avaliar a solução.</p></div></div><p class="caption">Se você parar de praticar a análise, como vai reconhecer um erro?</p>`,
    notes: "Já vi que temos contato com a IA. Mas todo mundo sabe o que ela possibilita? Rapidez, agilidade… sim, de certa forma. A pergunta é: o que estamos delegando? O esforço de implementação, escrever, organizar, repetir, pode ir para o agente. [Revele.] O julgamento, não: escolher, justificar e avaliar a solução continua sendo nosso. Se você parar de praticar a análise, como vai reconhecer um erro?",

  {
    id: "terceirizar", chapter: "Uso crítico de IA",
    title: "O risco: terceirizar o pensamento", terms: ["Atrofia cognitiva","Pensamento crítico"],
    html: `<h2>O risco: <span class="keyword">terceirizar</span><br>o pensamento.</h2><p class="lead">Usar a IA no lugar do raciocínio,<br>e não para ampliá-lo.</p><p class="caption reveal">Há quem chame isso de atrofia cognitiva. É uma metáfora para um hábito, não um diagnóstico.</p>`,
    notes: "E isso traz um risco que talvez você ainda não tenha percebido. Algumas pessoas chamam de atrofia cognitiva: o cérebro se acostuma, e até gosta, de terceirizar o pensamento crítico e as decisões difíceis. Em vez de usar a IA para potencializar o raciocínio, começamos a delegar decisões que deveríamos compreender e questionar. [Revele.] Não é um diagnóstico, é um hábito. E é aqui que entra o famoso vibe coding: vibecodar, por si só, não causa isso; terceirizar demais o esforço de pensar, pode causar.",
    check: "Um estudo de 2025 da Microsoft Research com a Carnegie Mellon (319 profissionais) associou mais confiança na IA a menos pensamento crítico autorrelatado. Isso não demonstra dano cerebral nem perda permanente: trate “atrofia cognitiva” como metáfora."

  {
    id: "vibecoding", chapter: "Uso crítico de IA",
    title: "Vibecoding", terms: ["Vibe coding","Andrej Karpathy","OpenAI","Lovable","Low-code e no-code","IA generativa"],
    html: `<h2>Vibecoding</h2><p class="lead definition">Gerar software por comandos em linguagem natural e seguir pelo resultado, sem acompanhar de perto o código produzido.</p><p class="caption">O termo foi popularizado por Andrej Karpathy em fevereiro de 2025.</p><p class="caption reveal">Usar IA e entender o que se entrega continua exigindo trabalho de engenharia.</p>`,
    notes: "Vibe coding tem alguns significados. O termo foi popularizado em fevereiro de 2025 por Andrej Karpathy, um dos fundadores da OpenAI e ex-diretor de IA da Tesla. Ele descrevia um jeito de programar se entregando ao fluxo: pedir em linguagem natural e aceitar o resultado sem acompanhar o código. O termo ganhou força com plataformas como a Lovable, que prometem criar um site a partir de uma ideia, e tomou o mundo low/no-code. Hoje, costuma descrever criar um sistema com dependência total da IA, sem revisar o que foi produzido. [Revele.] Mas usar IA para programar não é, automaticamente, vibe coding.",
    check: "Diferencie o uso amplo do termo de sua descrição original, em que Karpathy deixava de ler os diffs e o código ultrapassava sua compreensão. Ele foi membro fundador da OpenAI, não seu único fundador. O termo não foi criado pela Lovable. Não equipare toda programação assistida por IA a vibecoding.",

0%,0 76.67%);"></i></div></div><div class="at" style="--x:0px;--y:-19px;--z:23.6px"><i class="plane door3" style="width:14px;height:26px;margin:-13px 0 0 -7px;"></i></div></div></div></div></div><h3>Condomínio · microsserviços</h3><p>Cada serviço com sua fundação,<br>conversando pela rede.</p></div></div><p class="caption reveal">Mais casas pedem mais ruas, portões e manutenção. O tamanho do problema decide.</p>`,

  {
    id: "sdd", chapter: "Da intenção à especificação",
    title: "Spec-driven development", terms: ["Spec-Driven Development","Especificação","Critério de aceite"],
    html: `<h2>Spec-driven development</h2><div class="split"><div class="contrast negative"><h3>Uma intenção</h3><p>“Crie um login<br>com cadastro.”</p></div><div class="contrast positive reveal"><h3>Uma especificação</h3><p>Comportamento,<br>regras, restrições<br>e critérios de aceite.</p></div></div><p class="caption">A especificação orienta o que será implementado e como vamos conferir.</p>`,
    notes: "Para trabalhar desse jeito, precisamos conhecer algumas palavras-chave. A primeira é Spec-Driven Development, desenvolvimento orientado por especificação. Você não delega um desejo para a IA; você especifica o que ela deve fazer, com critérios de aceite. Um pedido como “crie um sistema de autenticação com login e cadastro” é uma intenção. [Revele.] Uma especificação diz o comportamento, as regras, as restrições e como vamos conferir. E não é só um prompt mais detalhado: é um documento que orienta a implementação, os testes e a validação.",
    check: "SDD é desenvolvimento orientado por especificação. Mostre que um prompt curto pode iniciar a conversa, mas não resolve as decisões do sistema. O objetivo não é escrever documentação gigantesca; é retirar ambiguidades relevantes."
  },
  {
    id: "requisitos", chapter: "Da intenção à especificação",
    title: "O que uma especificação precisa dizer", terms: ["Requisito funcional","Requisito não funcional","Regra de negócio","Critério de aceite","Argon2id","HTTP 401"],
    html: `<h2>O que precisamos definir?</h2><dl class="rows"><div class="row"><dt><span class="tag-id">RF01</span>Funcional</dt><dd>Autenticar com e-mail e senha.</dd></div><div class="row"><dt><span class="tag-id">RNF01</span>Não funcional</dt><dd>Armazenar senhas com hash Argon2id.</dd></div><div class="row"><dt><span class="tag-id">RN01</span>Regra de negócio</dt><dd>O e-mail deve ser <span class="keyword">único</span> no sistema.</dd></div><div class="row"><dt>Critério de aceite</dt><dd>Credenciais inválidas retornam HTTP 401.</dd></div><div class="row"><dt>Arquitetura</dt><dd>Respeitar os limites entre domínio, aplicação e infraestrutura.</dd></div></dl><p class="caption reveal">E se alguém errar a senha cinquenta vezes? E se o e-mail já estiver cadastrado?</p>`,

  {

    sources: [{"label":"Codex: instruções com AGENTS.md","url":"https://learn.chatgpt.com/docs/agent-configuration/agents-md"},{"label":"Claude Code: instruções e skills","url":"https://claude.com/resources/articles/steering-claude-code-skills-hooks-rules-subagents-and-more"}]

  {
    id: "documentacao", chapter: "Da intenção à especificação",
    title: "Do relato ao trabalho executável", terms: ["Documentação","Requisito funcional","Requisito não funcional","Diagrama de classes","Diagrama de casos de uso","História de usuário","Backlog","Issue"],
    html: `<h2>Do relato ao trabalho executável</h2><ol class="flow"><li>Conversa<small>Problema e contexto</small></li><li>Requisitos<small>Comportamento esperado</small></li><li>Modelo<small>Conceitos e relações</small></li><li>Tarefas<small>Entregas verificáveis</small></li></ol><p class="lead">Documentar é <span class="keyword">registrar decisões</span> que o próximo passo precisa conhecer.</p><p class="caption">Sem essas decisões, o agente preenche as lacunas por conta própria.</p>`,
    notes: "E a terceira é a documentação. É aqui que o engenheiro de software se destaca do “pedreiro digital”. Uma boa documentação envolve requisitos funcionais e não funcionais, diagramas de classe e de casos de uso, histórias de usuário e os próprios depoimentos e conversas com o cliente. É a etapa que mais evita vibecodar: normalmente você sabe o que quer, tem o depoimento, mas se não destrinchar esse depoimento de forma técnica, o agente preenche as lacunas por conta própria, por falta de decisões.",
    check: "Dê exemplos de documentos: relato do cliente, requisitos, diagramas de classe e de casos de uso, histórias e critérios de aceite. São recursos para esclarecer o trabalho. Não é preciso produzir todos em todo projeto. Um backlog organiza trabalho; issues podem representar melhorias e funcionalidades, além de erros."

  {
    id: "go-pergunta", chapter: "Uma decisão em código",
    title: "Por que copiar este valor?", terms: ["Struct","Ponteiro","Referência","Cópia"],
    html: `<h2>Por que <span class="keyword">copiar</span> este valor?</h2><div class="split exercise"><div><pre class="code"><code><span class="kw">type</span> CNPJ <span class="kw">struct</span> {
    Valor <span class="kw">string</span>
}

<span class="kw">type</span> Empresa <span class="kw">struct</span> {
    cnpj *CNPJ
}

<span class="kw">func</span> (e *Empresa) CNPJ() *CNPJ {
    copia := *e.cnpj
    <span class="kw">return</span> &amp;copia
}</code></pre></div><div><p class="lead">Já temos um ponteiro.<br>Por que não retornar<br><code>e.cnpj</code>?</p><p class="caption reveal">Quem recebe a referência pode alterar o estado original.</p></div></div>`,
    notes: "Vamos ver uma decisão em código. Go é parecida com C: usa structs e ponteiros. Aqui a empresa guarda um ponteiro para o CNPJ, mas o método cria uma cópia e devolve o ponteiro da cópia. Alguém sabe identificar qual decisão foi tomada aqui? [Espere respostas.] Se já temos um ponteiro, por que não devolvê-lo direto? Seria mais simples e custaria menos.",
    check: "O exemplo pressupõe e.cnpj não nulo e CNPJ contendo apenas uma string; uma string em Go é imutável. O campo exportado Valor permite demonstrar a mutação. Uma cópia superficial não isola automaticamente slices, maps ou outros ponteiros. Um value object com API imutável muda a análise. O código corrige String, return &var e a sintaxe do roteiro. No roteiro, “return &var” não compila; o slide usa “return &copia”.",
    sources: [{"label":"Especificação de Go: valores e referências","url":"https://go.dev/ref/spec#Representation_of_values"}]
  },
  {
    id: "go-tradeoff", chapter: "Uma decisão em código",
    title: "Referência ou cópia?", terms: ["Trade-off","Referência","Cópia defensiva"],
    html: `<h2>Referência ou <span class="keyword">cópia?</span></h2><div class="split"><div><p class="lead">O que acontece se quem recebe alterar o valor?</p><div class="demo-actions"><button class="action" data-demo="reference" aria-pressed="true">Entregar referência</button><button class="action secondary" data-demo="copy" aria-pressed="false">Entregar cópia</button></div><p class="caption">Demonstração simplificada do exemplo em Go.</p></div><div><div class="memory"><div id="original-memory"><span>Empresa</span><output id="original-value">Original</output></div><div><span>Valor entregue</span><output id="consumer-value">Original</output></div></div><p class="demo-result" id="demo-result">A referência compartilha o estado: a empresa também foi alterada.</p></div></div><p class="caption">Decida pelo contrato e pela necessidade de isolamento. Meça custos antes de otimizar.</p>`,
    notes: "Isso é um trade-off: uma decisão com pontos positivos e negativos. Se devolvermos a referência, quem recebe pode alterar o CNPJ da empresa em outra parte do código, sem querer. [Mostre os dois botões.] A cópia isola essa alteração, com um pequeno custo. Em projetos pequenos, devolver a referência pode ser um trade-off aceitável. É aqui que mora o olhar crítico sobre o código gerado: a IA escreve qualquer uma das duas versões; quem decide qual é a certa é você.",
    check: "Os exemplos alternam a cada 3 segundos. Os botões simulam referência e cópia usando objetos JavaScript; não executam Go no navegador. A cópia protege o exemplo, mas não resolve toda mutabilidade em qualquer struct. Retornar por valor também pode ser uma boa API. Não afirme que uma cópia pequena implica um custo importante sem medir. A otimização não justifica quebrar um contrato de domínio."
  },

  }

  function fitSlide() {
    // Os palcos 3D têm tamanho nominal; a escala acompanha a largura disponível.
    slideElement.querySelectorAll(".stage3d").forEach(stage => {
      stage.style.setProperty("--k", String(stage.clientWidth / Number(stage.dataset.width || stage.clientWidth || 1)));
    });
    const content = slideElement.querySelector(".slide-content");
    // Durante a entrada, o deslocamento das peças inflaria a medida do conteúdo.
    if (!content || settling) return;
    const style = getComputedStyle(slideElement);
    const width = slideElement.clientWidth - parseFloat(style.paddingLeft) - parseFloat(style.paddingRight);
    const height = slideElement.clientHeight - parseFloat(style.paddingTop) - parseFloat(style.paddingBottom);
    const naturalWidth = Math.max(content.offsetWidth, content.scrollWidth);
    const naturalHeight = Math.max(content.offsetHeight, content.scrollHeight);
    if (width <= 0 || height <= 0 || naturalWidth <= 0 || naturalHeight <= 0) return;
    // A margem preserva contornos de foco e arredondamentos de subpixel.
    const scale = Math.min(1, (width - 12) / naturalWidth, (height - 12) / naturalHeight);
    content.style.transform = `scale(${Math.max(0, scale)})`;
  }

  function stopAutoplay() {
    if (timer !== null) clearInterval(timer);
    timer = null;
  }

  function isAutomaticSlide() {
    return ["go-tradeoff", "dor-requisito"].includes(SLIDES[index].id);
  }

  function updateAutoplay() {
    stopAutoplay();
    autoplay.hidden = !isAutomaticSlide();
    autoplay.setAttribute("aria-pressed", String(paused));
    const label = paused ? "Retomar demonstração" : "Pausar demonstração";
    autoplay.setAttribute("aria-label", label);
    autoplay.title = `${label} (P)`;
    document.querySelector("#autoplay-icon").setAttribute("d", paused ? "m8 5 11 7-11 7Z" : "M9 5v14M15 5v14");
    if (!isAutomaticSlide() || paused || document.hidden) return;
    timer = setInterval(() => {
      demoStep++;
      if (SLIDES[index].id === "go-tradeoff") {
        runPointerDemo(demoModes[demoStep % demoModes.length]);
        swapFeedback(".memory");
        swapFeedback("#demo-result");
      } else {
        selectRequirement(requirementModes[demoStep % requirementModes.length]);
        swapFeedback(".translation-output");
      }
      fitSlide();
    }, DEMO_INTERVAL_MS);
  }

  // Suspende o ajuste de escala até as entradas terminarem e mede de novo ao final.
  function settle(animations) {
    const finished = animations.map(animation => animation?.finished).filter(Boolean);
    if (!finished.length) {settling = false; return;}
    const token = ++motionToken;
    settling = true;
    Promise.allSettled(finished).then(() => {
      if (token !== motionToken) return;
      settling = false;
      fitSlide();
    });
  }

  // Um único quadro inicial: o destino é o estilo do próprio elemento.
  // translate é independente do transform usado para ajustar o slide à tela.
  // Movimento reduzido mantém só a opacidade, sem deslocamento nem escalonamento.
  function enter(element, from, delay = 0, duration = ENTER_MS) {
    if (!element?.animate) return null;
    element.getAnimations().forEach(animation => animation.cancel());
    if (reducedMotion.matches) {
      return element.animate([{opacity: 0, offset: 0}], {duration: REDUCED_MS, easing: "ease", fill: "backwards"});
    }
    return element.animate([{opacity: 0, translate: from, offset: 0}], {
      duration, delay, easing: EASE_OUT, fill: "backwards"
    });
  }

  function entrancePieces(content) {
    const pieces = [...content.children].flatMap(child =>
      child.matches(GROUPS) && !child.matches(".reveal") ? [...child.children] : [child]);
    const visible = pieces.filter(piece => !piece.matches(".reveal:not(.shown)"));
    return visible.length ? visible : [content];
  }

  // Avançar entra pela direita, voltar pela esquerda; saltos sobem no lugar.
  function animateSlide(direction) {
    const pieces = entrancePieces(slideElement.querySelector(".slide-content"));
    const from = direction > 0 ? "40px 0" : direction < 0 ? "-40px 0" : "0 24px";
    const step = Math.min(STAGGER_MS, STAGGER_BUDGET_MS / Math.max(1, pieces.length - 1));
    settle(pieces.map((piece, position) => enter(piece, from, position * step)));
  }

  // Mostra as peças das etapas já reveladas; sem animação (usado ao entrar e ao recolher).
  function syncBuild() {
    const stages = new Set([...slideElement.querySelectorAll(".reveal.shown[data-build]")].map(element => element.dataset.build));
    slideElement.querySelectorAll("[data-part]").forEach(part => part.classList.toggle("shown", stages.has(part.dataset.part)));
    // A câmera da cena acompanha a última etapa revelada (ver .stage3d[data-stage] no CSS).
    const order = [...slideElement.querySelectorAll(".reveal.shown[data-build]")].map(element => element.dataset.build);
    slideElement.querySelectorAll(".stage3d").forEach(stage => {
      stage.dataset.stage = order.filter(name => stage.querySelector(`[data-part="${name}"]`)).at(-1) || "";
    });
  }

  function build(stage) {
    slideElement.querySelectorAll(`[data-part="${stage}"]`).forEach((part, position) => {
      // Peças 3D animam o filho .anim; o pai guarda a posição no espaço.
      const target = part.querySelector(":scope > .anim") || part;
      if (!target.animate) return;
      target.getAnimations().forEach(animation => animation.cancel());
      if (reducedMotion.matches) {
        // Opacidade achataria as peças 3D: com movimento reduzido elas só aparecem.
        if (target === part) target.animate([{opacity: 0, offset: 0}], {duration: REDUCED_MS, easing: "ease", fill: "backwards"});
        return;
      }
      const {frames, duration, easing} = BUILDS[part.dataset.anim] || BUILDS.fade;
      const delay = Number(part.dataset.delay ?? position * 90);
      target.animate(frames, {duration, delay, easing, fill: "backwards"});
    });
  }

  function hideReveal(element) {
    if (!element.animate) return;
    element.getAnimations().forEach(animation => animation.cancel());
    // A classe já saiu: a animação segura a visibilidade enquanto apaga.
    element.animate([{opacity: 1, visibility: "visible"}, {opacity: 0, visibility: "visible"}], {
      duration: HIDE_MS, easing: "ease"
    });
  }

  // As trocas automáticas usam somente opacidade para manter a leitura estável.
  function swapFeedback(selector) {
    const target = slideElement.querySelector(selector);
    if (!target?.animate) return;
    target.getAnimations().forEach(animation => animation.cancel());
    target.animate([{opacity: 0, offset: 0}], {duration: SWAP_MS, easing: "ease"});
  }

  /* ---------- QR codes e links (dicionário, GitHub, LinkedIn) ---------- */

  const qrCache = new Map();
  // Gera o QR localmente (assets/qrcode.js), sem depender de internet.
  // level "L" deixa o QR pequeno do canto menos denso; os grandes usam "M".
  function qrSvg(text, level = "M") {
    if (typeof qrcode !== "function") return "";
    const key = `${level}:${text}`;
    if (!qrCache.has(key)) {
      const code = qrcode(0, level);
      code.addData(text);
      code.make();
      const size = code.getModuleCount();
      let path = "";
      for (let row = 0; row < size; row++) {
        for (let column = 0; column < size; column++) {
          if (code.isDark(row, column)) path += `M${column} ${row}h1v1h-1z`;
        }
      }
      qrCache.set(key, `<svg viewBox="0 0 ${size} ${size}" shape-rendering="crispEdges" aria-hidden="true"><path d="${path}"/></svg>`);
    }
    return qrCache.get(key);
  }

  const linkFor = key => (typeof WORKSHOP_LINKS === "object" ? WORKSHOP_LINKS[key] : undefined);

  function renderLinks() {
    slideElement.querySelectorAll("[data-qr]").forEach(element => {
      const url = linkFor(element.dataset.qr);
      if (url) element.innerHTML = qrSvg(url);
    });
    slideElement.querySelectorAll("[data-link]").forEach(element => {
      const url = linkFor(element.dataset.link);
      if (url) element.href = url;
    });
    slideElement.querySelectorAll("[data-link-text]").forEach(element => {
      const url = linkFor(element.dataset.linkText);
      if (url) element.textContent = url.replace(/^https?:\/\//, "").replace(/\/$/, "");
    });
    // QR do canto: abre o dicionário direto nos termos do slide atual.
    const corner = document.querySelector("#slide-qr");
    const base = linkFor("dicionario");
    const slide = SLIDES[index];
    corner.hidden = !base || slide.id === "dicionario" || typeof qrcode !== "function";
    if (!corner.hidden) {
      const url = `${base}#${slide.id}`;
      corner.href = url;
      corner.querySelector(".qr").innerHTML = qrSvg(url, "L");
    }
  }

  function updateNavigation() {
    const totalReveals = slideElement.querySelectorAll(".reveal").length;
    previous.disabled = index === 0 && revealCount === 0;
    next.disabled = index === SLIDES.length - 1 && revealCount === totalReveals;
    document.querySelector("#counter").textContent = `${String(index + 1).padStart(2, "0")} / ${SLIDES.length}`;
    next.setAttribute("aria-label", revealCount < totalReveals ? "Revelar próximo conteúdo" : "Próximo slide");
    progress.setAttribute("aria-valuemax", SLIDES.length);
    progress.setAttribute("aria-valuenow", index + 1);
    progress.querySelector("span").style.transform = `scaleX(${(index + 1) / SLIDES.length})`;
  }

  function render({revealAll = false, updateHash = true, direction = 0} = {}) {
    stopAutoplay();
    fitObserver?.disconnect();
    const slide = SLIDES[index];
    slideElement.className = `slide ${slide.className || ""}`;
    slideElement.innerHTML = `<div class="slide-content">${slide.html}</div>`;
    slideElement.dataset.slideId = slide.id;
    renderLinks();
    document.body.dataset.tone = slide.className === "statement" ? "green" : "white";
    slideElement.setAttribute("aria-label", `Slide ${index + 1} de ${SLIDES.length}: ${slide.title}`);
    slideElement.querySelectorAll(".reveal").forEach(element => {
      element.classList.toggle("shown", revealAll);
      element.setAttribute("aria-hidden", String(!revealAll));
    });
    revealCount = revealAll ? slideElement.querySelectorAll(".reveal").length : 0;
    document.querySelector("#chapter").textContent = slide.chapter;
    document.title = `${slide.title} · Além do Vibecoding`;
    if (updateHash && location.hash !== `#${slide.id}`) history.pushState(null, "", `#${slide.id}`);
    window.dispatchEvent(new CustomEvent("workshop:slidechange", {
      detail: {id: slide.id, index, title: slide.title, terms: [...slide.terms]}
    }));
    demoStep = 0;
    paused = false;
    if (slide.id === "go-tradeoff") runPointerDemo("reference");
    if (slide.id === "dor-requisito") selectRequirement("tracking");
    syncBuild();
    updateNavigation();
    updateAutoplay();
    settling = false;
    fitSlide();
    animateSlide(direction);
    if (typeof ResizeObserver !== "undefined") {
      fitObserver = new ResizeObserver(fitSlide);
      fitObserver.observe(slideElement);
      fitObserver.observe(slideElement.querySelector(".slide-content"));
    }
    announce(`Slide ${index + 1}: ${slide.title}`);
    publishState();
  }

  function advance() {
    const reveals = slideElement.querySelectorAll(".reveal");
    if (revealCount < reveals.length) {
      const element = reveals[revealCount++];
      element.classList.add("shown");
      element.setAttribute("aria-hidden", "false");
      syncBuild();
      // Uma cena ilustrada se monta pelas próprias peças; o texto sobe como as outras revelações.
      if (!element.querySelector?.(".stage3d")) settle([enter(element, "0 20px", 0, REVEAL_MS)]);
      if (element.dataset.build) build(element.dataset.build);
      updateNavigation();
      announce(element.textContent);
      publishState();
    } else if (index < SLIDES.length - 1) {
      index++;
      render({direction: 1});
    }
  }

  function goBack() {
    if (revealCount > 0) {
      const element = slideElement.querySelectorAll(".reveal")[--revealCount];
      element.classList.remove("shown");
      element.setAttribute("aria-hidden", "true");
      hideReveal(element);
      syncBuild();
      updateNavigation();
      announce("Último conteúdo recolhido.");
      publishState();
    } else if (index > 0) {
      index--;
      render({revealAll: true, direction: -1});
    }
  }

  function publishState() {
    const message = {workshop: true, type: "state", index, reveal: revealCount, reveals: slideElement.querySelectorAll(".reveal").length};
    try {
      if (presenterWindow && !presenterWindow.closed) presenterWindow.postMessage(message, "*");
    } catch {
      presenterWindow = null;
    }
    channel?.postMessage(message);
  }

  // Comandos da janela do apresentador: só navegação, nada além disso é aceito.
  function handlePresenter(data, source) {
    if (!data || data.workshop !== true) return;
    if (source && typeof source.postMessage === "function" && source !== window) presenterWindow = source;
    if (data.type === "hello") publishState();
    else if (data.type === "next") advance();
    else if (data.type === "prev") goBack();
  }

  function openPresenter() {
    const url = `${location.href.split("#")[0].split("?")[0]}?presenter`;
    presenterWindow = window.open(url, CHANNEL_NAME, "popup,width=1180,height=760");
    if (!presenterWindow) announce("O navegador bloqueou a janela do apresentador. Permita pop-ups para esta página.");
  }

  async function toggleFullscreen() {
    try {
      if (document.fullscreenElement) await document.exitFullscreen();
      else if (document.documentElement.requestFullscreen) await document.documentElement.requestFullscreen();
      else announce("Use a opção de tela cheia do seu navegador.");
    } catch {
      announce("O navegador não permitiu a tela cheia. Use a opção de tela cheia do navegador.");
    }
  }

  function runPointerDemo(mode) {
    const empresa = {cnpj: {valor: "Original"}};
    const entregue = mode === "reference" ? empresa.cnpj : {...empresa.cnpj};
    entregue.valor = "Alterado";
    const changed = empresa.cnpj.valor === "Alterado";
    document.querySelector("#original-value").textContent = empresa.cnpj.valor;
    document.querySelector("#consumer-value").textContent = entregue.valor;
    document.querySelector("#original-memory").dataset.changed = String(changed);
    slideElement.querySelectorAll("[data-demo]").forEach(button => {
      button.setAttribute("aria-pressed", String(button.dataset.demo === mode));
    });
    document.querySelector("#demo-result").textContent = changed
      ? "A referência compartilha o estado: a empresa também foi alterada."
      : "A cópia deste valor isola a alteração: a empresa preserva o original.";
  }

  function selectRequirement(mode) {
    const example = REQUIREMENT_EXAMPLES[mode];
    if (!example) return;
    slideElement.querySelectorAll("[data-requirement]").forEach(choice => {
      choice.setAttribute("aria-pressed", String(choice.dataset.requirement === mode));
    });
    document.querySelector("#requirement-text").textContent = example.text;
    document.querySelector("#requirement-acceptance").textContent = example.acceptance;
  }

  function toggleAutoplay() {
    if (!isAutomaticSlide()) return;
    paused = !paused;
    updateAutoplay();
    announce(paused ? "Demonstração pausada." : "Demonstração retomada.");
  }

  previous.addEventListener("click", goBack);
  next.addEventListener("click", advance);
  fullscreen.addEventListener("click", toggleFullscreen);
  autoplay.addEventListener("click", toggleAutoplay);
  document.querySelector(".skip-link").addEventListener("click", event => {
    event.preventDefault();
    slideElement.focus({preventScroll: true});
  });
  document.addEventListener("fullscreenchange", () => {
    fullscreen.setAttribute("aria-label", document.fullscreenElement ? "Sair da tela cheia" : "Entrar em tela cheia");
    fitSlide();
  });
  document.addEventListener("visibilitychange", updateAutoplay);
  window.addEventListener("pagehide", stopAutoplay);
  window.addEventListener("pageshow", updateAutoplay);
  slideElement.addEventListener("click", event => {
    const demo = event.target.closest("[data-demo]");
    const requirement = event.target.closest("[data-requirement]");
    if (demo) {
      runPointerDemo(demo.dataset.demo);
      demoStep = demoModes.indexOf(demo.dataset.demo);
      announce(document.querySelector("#demo-result").textContent);
    }
    if (requirement) {
      selectRequirement(requirement.dataset.requirement);
      demoStep = requirementModes.indexOf(requirement.dataset.requirement);
      announce(document.querySelector("#requirement-text").textContent);
    }
    if (demo || requirement) {fitSlide(); updateAutoplay();}
  });
  document.addEventListener("keydown", event => {
    if (event.ctrlKey || event.altKey || event.metaKey) return;
    if (event.target.closest("input, textarea, select, [contenteditable='true']")) return;
    if ([" ", "Enter"].includes(event.key) && event.target.closest("button, a")) return;
    switch (event.key) {
      case "ArrowRight": case "PageDown": case " ":
        event.preventDefault(); advance(); break;
      case "ArrowLeft": case "PageUp": case "Backspace":
        event.preventDefault(); goBack(); break;
      case "Home": event.preventDefault(); index = 0; render(); break;
      case "End": event.preventDefault(); index = SLIDES.length - 1; render(); break;
      case "f": case "F": event.preventDefault(); toggleFullscreen(); break;
      case "p": case "P": event.preventDefault(); toggleAutoplay(); break;
      case "n": case "N": event.preventDefault(); openPresenter(); break;
    }
  });
  window.addEventListener("message", event => handlePresenter(event.data, event.source));
  channel?.addEventListener("message", event => handlePresenter(event.data, null));
  window.addEventListener("resize", fitSlide);
  window.visualViewport?.addEventListener("resize", fitSlide);
  document.fonts?.ready.then(fitSlide);
  window.addEventListener("hashchange", () => {index = indexFromHash(); render({updateHash: false});});
  index = indexFromHash();
  render({updateHash: false});

  /* ---------- Janela do apresentador ---------- */

  function runPresenter() {
    // Roda antes das constantes da apresentação: não use nada declarado acima.
    document.title = "Apresentador · Além do Vibecoding";
    document.documentElement.classList.add("presenter-view");
    document.body.innerHTML = `
      <header class="pv-head">
        <span id="pv-counter">--</span>
        <span id="pv-chapter"></span>
        <button id="pv-timer" class="pv-timer" title="Zerar cronômetro (T)" aria-label="Cronômetro. Clique para zerar.">00:00</button>
      </header>
      <main class="pv-main">
        <section class="pv-notes" aria-live="polite">
          <h1 id="pv-title">Aguardando a apresentação…</h1>
          <p id="pv-step" class="pv-step"></p>
          <div id="pv-speech" class="pv-speech"></div>
          <p id="pv-check" class="pv-check"></p>
        </section>
        <aside class="pv-side">
          <span class="pv-label">A seguir</span>
          <p id="pv-next" class="pv-next"></p>
          <p id="pv-status" class="pv-status" role="status"></p>
          <nav class="pv-nav" aria-label="Controlar a apresentação">
            <button id="pv-prev" title="Voltar (←)">Voltar</button>
            <button id="pv-forward" title="Avançar (→ ou Espaço)">Avançar</button>
          </nav>
        </aside>
      </main>`;
    const $ = selector => document.querySelector(selector);
    let presenterChannel = null;
    try {
      presenterChannel = typeof BroadcastChannel === "function" ? new BroadcastChannel("workshop-presenter") : null;
    } catch {
      presenterChannel = null;
    }
    const send = type => {
      const message = {workshop: true, type};
      if (window.opener && !window.opener.closed) window.opener.postMessage(message, "*");
      else presenterChannel?.postMessage(message);
    };
    const parser = new DOMParser();
    const revealTexts = SLIDES.map(slide => [...parser.parseFromString(slide.html.replace(/<br\s*\/?>/g, " "), "text/html").querySelectorAll(".reveal")]
      .map(element => element.textContent.replace(/\s+/g, " ").trim()));
    let synced = false;

    // Indicações entre colchetes aparecem como marcações de palco.
    function speech(text) {
      const target = $("#pv-speech");
      target.replaceChildren();
      text.split(/(\[[^\]]+\])/).filter(Boolean).forEach(part => {
        const cue = part.startsWith("[");
        const node = document.createElement(cue ? "em" : "span");
        if (cue) node.className = "pv-cue";
        node.textContent = cue ? part.slice(1, -1) : part;
        target.append(node);
      });
    }

    function show(state) {
      const slide = SLIDES[state.index];
      if (!slide) return;
      synced = true;
      $("#pv-status").textContent = "";
      $("#pv-counter").textContent = `${String(state.index + 1).padStart(2, "0")} / ${SLIDES.length}`;
      $("#pv-chapter").textContent = slide.chapter;
      $("#pv-title").textContent = slide.title;
      $("#pv-step").textContent = state.reveals ? `Revelações: ${state.reveal} de ${state.reveals}` : "";
      speech(slide.notes || "");
      $("#pv-check").textContent = slide.check ? `Atenção: ${slide.check}` : "";
      $("#pv-check").hidden = !slide.check;
      const pending = revealTexts[state.index][state.reveal];
      const following = SLIDES[state.index + 1];
      $("#pv-next").textContent = state.reveal < state.reveals && pending
        ? `Revelar: ${pending}`
        : following ? `Slide ${state.index + 2}: ${following.title}` : "Fim da apresentação.";
      $("#pv-prev").disabled = state.index === 0 && state.reveal === 0;
      $("#pv-forward").disabled = !following && state.reveal >= state.reveals;
    }

    const receive = data => {
      if (data?.workshop === true && data.type === "state") show(data);
    };
    window.addEventListener("message", event => receive(event.data));
    presenterChannel?.addEventListener("message", event => receive(event.data));

    let started = Date.now();
    const tick = () => {
      const seconds = Math.floor((Date.now() - started) / 1000);
      $("#pv-timer").textContent = `${String(Math.floor(seconds / 60)).padStart(2, "0")}:${String(seconds % 60).padStart(2, "0")}`;
    };
    const resetTimer = () => {started = Date.now(); tick();};
    setInterval(tick, 1000);
    $("#pv-timer").addEventListener("click", resetTimer);
    $("#pv-prev").addEventListener("click", () => send("prev"));
    $("#pv-forward").addEventListener("click", () => send("next"));
    document.addEventListener("keydown", event => {
      if (event.ctrlKey || event.altKey || event.metaKey) return;
      if ([" ", "Enter"].includes(event.key) && event.target.closest("button")) return;
      if (["ArrowRight", "PageDown", " "].includes(event.key)) {event.preventDefault(); send("next");}
      if (["ArrowLeft", "PageUp", "Backspace"].includes(event.key)) {event.preventDefault(); send("prev");}
      if (event.key === "t" || event.key === "T") resetTimer();
    });
    send("hello");
    setTimeout(() => {
      if (!synced) $("#pv-status").textContent = "Sem conexão com a apresentação. Abra esta janela pela apresentação, com a tecla N.";
    }, 1500);
  }
})();

</script>
</body>
</html>
